# Local E2E reproduction for
# https://github.com/grafana/crossplane-provider-grafana/issues/662
#
# This fixture creates two organizations:
#
# 1. organization-users-omitted does not configure admins, editors, or viewers.
# 2. organization-users-init-empty configures empty membership sets only in
#    initProvider.
#
# Its uptest post-assert hook adds the users below to both organizations through
# the Grafana API and then changes the organization names to force Terraform's
# update path.
#
# For omitted optional sets, terraform-provider-grafana's ReadUsers adds the
# observed memberships to Terraform state. The next Terraform diff treats the
# configured sets as empty, and UpdateUsers removes the observed users.
#
# For initProvider, Upjet should ignore fields present only there after creation.
# Empty slices are omitted during the API round trip because the generated Go
# fields use omitempty, so the three fields no longer contribute to Upjet's
# ignored-field list. They consequently behave like the omitted case.
#
# The post-assert hook expects the desired behavior and currently fails both
# assertions, reproducing the issue.
---
apiVersion: oss.grafana.crossplane.io/v1alpha1
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/organization-init-provider
    uptest.upbound.io/disable-import: "true"
    uptest.upbound.io/post-assert-hook: ../../../cluster/test/test-organization-init-provider.sh
  labels:
    testing.upbound.io/example-name: organization-users-omitted
  name: organization-users-omitted
spec:
  managementPolicies:
  - Observe
  - Create
  - Update
  - Delete
  forProvider:
    createUsers: false
    name: Organization Users Omitted
  providerConfigRef:
    name: grafana-provider

---
apiVersion: oss.grafana.crossplane.io/v1alpha1
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/organization-init-provider
    uptest.upbound.io/disable-import: "true"
  labels:
    testing.upbound.io/example-name: organization-users-init-empty
  name: organization-users-init-empty
spec:
  managementPolicies:
  - Observe
  - Create
  - Update
  - Delete
  forProvider:
    createUsers: false
    name: Organization Users Init Empty
  initProvider:
    admins: []
    editors: []
    viewers: []
  providerConfigRef:
    name: grafana-provider

---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/organization-init-provider
  labels:
    testing.upbound.io/example-name: organization-init-provider-users
  name: organization-init-provider-users
  namespace: upbound-system
stringData:
  password: example-password

---
apiVersion: oss.grafana.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/organization-init-provider
    uptest.upbound.io/disable-import: "true"
  labels:
    testing.upbound.io/example-name: organization-external-admin
  name: organization-external-admin
spec:
  forProvider:
    email: organization-external-admin@example.com
    login: organization-external-admin
    name: Organization External Admin
    passwordSecretRef:
      key: password
      name: organization-init-provider-users
      namespace: upbound-system
  providerConfigRef:
    name: grafana-provider

---
apiVersion: oss.grafana.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/organization-init-provider
    uptest.upbound.io/disable-import: "true"
  labels:
    testing.upbound.io/example-name: organization-external-editor
  name: organization-external-editor
spec:
  forProvider:
    email: organization-external-editor@example.com
    login: organization-external-editor
    name: Organization External Editor
    passwordSecretRef:
      key: password
      name: organization-init-provider-users
      namespace: upbound-system
  providerConfigRef:
    name: grafana-provider

---
apiVersion: oss.grafana.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/organization-init-provider
    uptest.upbound.io/disable-import: "true"
  labels:
    testing.upbound.io/example-name: organization-external-viewer
  name: organization-external-viewer
spec:
  forProvider:
    email: organization-external-viewer@example.com
    login: organization-external-viewer
    name: Organization External Viewer
    passwordSecretRef:
      key: password
      name: organization-init-provider-users
      namespace: upbound-system
  providerConfigRef:
    name: grafana-provider
