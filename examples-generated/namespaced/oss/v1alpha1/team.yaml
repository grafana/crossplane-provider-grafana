apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: Team
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/team
  labels:
    testing.upbound.io/example-name: test-team
  name: test-team
  namespace: upbound-system
spec:
  forProvider:
    admins:
    - ${grafana_user.team_admin.email}
    email: teamemail@example.com
    memberRefs:
    - name: viewer
    name: Test Team

---

apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/team
  labels:
    testing.upbound.io/example-name: team_admin
  name: team-admin
  namespace: upbound-system
spec:
  forProvider:
    email: team-admin@example.com
    login: team-admin
    name: Team Admin
    passwordSecretRef:
      key: example-key
      name: example-secret

---

apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: oss/v1alpha1/team
  labels:
    testing.upbound.io/example-name: viewer
  name: viewer
  namespace: upbound-system
spec:
  forProvider:
    email: viewer@example.com
    login: viewer
    name: Viewer
    passwordSecretRef:
      key: example-key
      name: example-secret
