apiVersion: agento11y.grafana.crossplane.io/v1alpha1
kind: EvaluationRule
metadata:
  annotations:
    meta.upbound.io/example-id: agento11y/v1alpha1/evaluationrule
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    enabled: true
    evaluatorIds:
    - ${grafana_agento11y_evaluator.example.evaluator_id}
    executionMode: parallel
    filterableTagKeys:
    - environment
    - team
    match: |-
      ${jsonencode({
          agent_name = "checkout-*"
        })}
    ruleId: score_user_turns
    sampleRate: 0.1
    selector: user_visible_turn

---

apiVersion: agento11y.grafana.crossplane.io/v1alpha1
kind: Evaluator
metadata:
  annotations:
    meta.upbound.io/example-id: agento11y/v1alpha1/evaluationrule
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    config: |-
      ${jsonencode({
          pattern = "(?i)(api[_-]?key|password|secret)"
        })}
    evaluatorId: no_secrets
    kind: regex
    outputKeys: |-
      ${jsonencode([
          {
            key  = "clean"
            type = "bool"
          }
        ])}
    version: "1"
