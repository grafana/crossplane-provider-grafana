        description: Severity is the Schema for the Severitys API. Manages a Grafana
          Incident severity, which expresses the impact of an incident. Besides Pending,
          an organization can therefore hold at most 5 severities, archived or not.
          A new organization starts with Pending, Critical, Major and Minor, which
          leaves two levels free. When a new severity's level or label is already
          taken, the error names the severity that holds it.An archived severity keeps
          its label and level, so neither can be reused until it is deleted. Archiving
          a severity does not free its level for another one.The level cannot be changed
          after the severity is created, so changing level replaces the severity.
          The plan is refused when another severity, archived or not, already holds
          the new level or label, since the replacement would otherwise delete the
          severity and then fail to create it. create_before_destroy cannot be used,
          because the new severity would conflict with the old one's level or label.A
          severity that any incident uses, open or closed, cannot be deleted, and
          that includes the delete a replacement makes. Set archived = true to retire
          it instead, which keeps the incident history intact. To stop managing it
          without deleting it, use a removed block with lifecycle { destroy = false
          }. The Pending severity Every organization has a system-managed Pending
          severity at level -1, which incidents get when they are declared without
          one. It can be imported and its label, description, icon and colors changed,
          but it cannot be archived, its level cannot change, and a second one cannot
          be created. Official documentation https://grafana.com/docs/grafana-cloud/alerting-and-irm/irm/incident/API
          documentation https://grafana.com/docs/grafana-cloud/alerting-and-irm/irm/incident/api/
