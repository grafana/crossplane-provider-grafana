        description: 'CustomField is the Schema for the CustomFields API. Manages
          a Grafana Incident custom field, which records extra information on every
          incident, such as the affected team or the customer impact. It can be changed
          without replacing the field.The type cannot be changed after the field is
          created, so changing type replaces the field. create_before_destroy cannot
          be used, because the new field would conflict with the old one''s slug.A
          select option is identified by its value. Changing an option''s label, description,
          color or icon updates it in place, but changing its value deletes the option
          and adds a new one. Option values must be unique within the field.A field
          or select option that is a value on any incident, open or resolved, cannot
          be deleted, archived or not. Deleting it, removing the option, or changing
          the option''s value or the field''s type, which deletes and creates it again,
          fails.To retire a field or a select option that incidents use, archive it
          instead: set archived = true. Archived fields and options can''t be used
          on new incidents, but incidents that already use them keep them.Default
          values are not managed by this resource, since the Incident API does not
          expose them. A default set in the UI is kept. Only fields in the incident
          domain are supported. Fields synced with Grafana labels and system-managed
          fields cannot be imported. Official documentation https://grafana.com/docs/grafana-cloud/alerting-and-irm/irm/incident/API
          documentation https://grafana.com/docs/grafana-cloud/alerting-and-irm/irm/incident/api/'
