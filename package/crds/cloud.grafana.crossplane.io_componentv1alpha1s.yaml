        description: 'ComponentV1Alpha1 is the Schema for the ComponentV1Alpha1s API.
          Manages services in Grafana Service Center via the Service Model API (servicemodel.ext.grafana.com/v1alpha1,
          kind Component). Services are catalog components of type service (the default
          for spec.type). Service Center currently displays components of type service;
          components of other types are stored but not shown. Availability: Grafana
          Cloud. The API is v1alpha1 and may evolve; the attributes exposed here are
          stable. Naming: metadata.uid is the object name, e.g. checkout-service.
          It can only contain lowercase letters, numbers and dashes, must start and
          end with a letter or number, and must be 2 to 63 characters long. Changing
          metadata.uid replaces the resource (destroy and create). The uid is also
          the service identifier: dashboards, alerts, SLOs and other resources are
          matched to the service when they carry a service_name label or tag equal
          to it; the identifiers block can add further values to match. Backstage
          catalog sync: services imported from Backstage https://grafana.'
