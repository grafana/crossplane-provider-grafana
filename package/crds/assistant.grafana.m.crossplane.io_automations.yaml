          Grafana Assistant Automation: a saved Assistant prompt that runs on demand
          or on a cron schedule. Each run creates its own Assistant conversation.
          Automations are a Grafana Cloud-only feature and require the Grafana Assistant
          app. execution_mode selects the identity used for runs. The default user
          mode uses the creator''s Grafana permissions. service_account mode requires
          tenant scope and organization Admin permission to configure. Runtime memory
          and run history remain backend-owned.'
